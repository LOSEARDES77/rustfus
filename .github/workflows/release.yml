# Builds, tests and publishes a GitHub release when a version tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Assets: Windows .exe (x86_64, ARM64), macOS universal .dmg, Linux AppImage,
# .deb and .rpm (x86_64, ARM64), Arch .pkg.tar.zst (x86_64), GPL sources.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Tag must match Cargo.toml version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "${GITHUB_REF_NAME}" = "v${version}" ] || { echo "Tag ${GITHUB_REF_NAME} != v${version} in Cargo.toml"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux GUI dependencies and optional disk-image test tools
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool pkg-config libfontconfig1-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libegl1-mesa-dev xorriso genisoimage dosfstools e2fsprogs fdisk qemu-utils
      - run: cargo test --workspace --locked
      # Native GUI backend SDKs are checked by each platform's CI job.
      - name: Clippy (Linux)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  windows:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, arch: x86_64 }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc, arch: aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      # GPUI supplies the sole manifest; the CLI host requests UAC via runas.
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - shell: bash
        run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/rustfus.exe" "dist/Rustfus-${GITHUB_REF_NAME}-windows-${{ matrix.arch }}.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: pkg-windows-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  macos:
    needs: test
    # Icon Composer compilation needs full Xcode 26+ on macOS 26+.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install native helper build dependencies
        run: brew install autoconf automake libtool pkg-config
      - name: Validate macOS icon packaging
        run: |
          xcodebuild -version
          xcrun --find actool
          python3 packaging/test-macos-icons.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo build --locked --release --target aarch64-apple-darwin
          cargo build --locked --release --target x86_64-apple-darwin
      - name: Universal Rustfus.app in a .dmg
        run: |
          version=${GITHUB_REF_NAME#v}
          app=build/Rustfus.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" dist
          lipo -create -output "$app/Contents/MacOS/rustfus" \
            target/aarch64-apple-darwin/release/rustfus target/x86_64-apple-darwin/release/rustfus
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Rustfus</string>
            <key>CFBundleDisplayName</key><string>Rustfus</string>
            <key>CFBundleIdentifier</key><string>io.github.rustfus</string>
            <key>CFBundleVersion</key><string>${version}</string>
            <key>CFBundleShortVersionString</key><string>${version}</string>
            <key>CFBundleExecutable</key><string>rustfus</string>
            <key>CFBundleIconFile</key><string>rustfus</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSRemovableVolumesUsageDescription</key><string>Rustfus needs access to removable volumes to create bootable media.</string>
          </dict></plist>
          EOF
          python3 packaging/macos-icons.py "$app" --mode required
          plutil -lint "$app/Contents/Info.plist"
          cp LICENSE README.md THIRD_PARTY_NOTICES.md build/
          ln -s /Applications build/Applications
          hdiutil create -volname "Rustfus ${version}" -srcfolder build -ov -format UDZO \
            "dist/Rustfus-${GITHUB_REF_NAME}-macos-universal.dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: pkg-macos
          path: dist/*
          if-no-files-found: error

  linux:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 (glibc 2.35) so the binaries run on older distributions too.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, arch: x86_64 }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, arch: aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm
      - name: Install Linux GUI build dependencies
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool pkg-config libfontconfig1-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libegl1-mesa-dev
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: .deb, .rpm and AppImage
        run: |
          version=${GITHUB_REF_NAME#v}
          mkdir -p dist
          cargo deb -p rustfus-cli --no-build --target ${{ matrix.target }} --deb-version "${version}-1" -o dist/
          # RPM versions can't contain '-'; '~' sorts pre-releases correctly.
          rpm_version=$(echo "$version" | tr - '~')
          cargo generate-rpm -p crates/rustfus-cli --target ${{ matrix.target }} -s "version = \"$rpm_version\"" -o dist/
          packaging/appimage.sh "target/${{ matrix.target }}/release/rustfus" "$version" ${{ matrix.arch }} dist
          ls -la dist
      - uses: actions/upload-artifact@v7
        with:
          name: pkg-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: bin-linux-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/rustfus
          if-no-files-found: error

  arch:
    needs: linux
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      # The package is built from the Linux artifact and packaging assets;
      # neither vendored submodule is needed in the minimal Arch container.
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: bin-linux-x86_64
          path: bin
      - name: makepkg
        run: |
          version=${GITHUB_REF_NAME#v}
          useradd -m builder
          mkdir -p /tmp/arch dist
          sed "s/@VERSION@/$(echo "$version" | tr - _)/" packaging/PKGBUILD > /tmp/arch/PKGBUILD
          chown -R builder /tmp/arch
          chmod 755 bin/rustfus
          su builder -c "cd /tmp/arch && REPO='$PWD' BIN='$PWD/bin/rustfus' makepkg --nodeps"
          cp /tmp/arch/*.pkg.tar.zst dist/
      - uses: actions/upload-artifact@v7
        with:
          name: pkg-arch
          path: dist/*
          if-no-files-found: error

  # GPL corresponding source for the binaries embedded from res/.
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Download upstream sources listed in res/SOURCES.txt
        run: |
          dir="rustfus-${GITHUB_REF_NAME}-third-party-sources"
          mkdir -p "$dir" dist
          grep -E '^https://' res/SOURCES.txt | while read -r url; do
            name=$(echo "$url" | sed -E 's|https://||; s|^web\.archive\.org/web/[0-9]+id_/https://||; s|/archive/refs/tags/|-|; s|/archive/|-|; s|[/]|_|g')
            curl -fsSL --retry 3 -o "$dir/$name" "$url"
          done
          python3 packaging/native/source-archive.py "$dir/rustfus-corresponding-source.tar.gz"
          cp res/SOURCES.txt THIRD_PARTY_NOTICES.md "$dir/"
          for f in res/*/readme.txt; do cp "$f" "$dir/$(basename "$(dirname "$f")")-readme.txt"; done
          tar cf "dist/$dir.tar" "$dir"
          cp LICENSE THIRD_PARTY_NOTICES.md dist/
      - uses: actions/upload-artifact@v7
        with:
          name: pkg-sources
          path: dist/*
          if-no-files-found: error

  release:
    needs: [windows, macos, linux, arch, sources]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: pkg-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=""; [[ "${GITHUB_REF_NAME}" == *-* ]] && prerelease="--prerelease"
          gh release create "${GITHUB_REF_NAME}" dist/* --title "Rustfus ${GITHUB_REF_NAME}" --generate-notes $prerelease \
            --notes "Writing disks needs root/Administrator. Third-party GPL sources are in the *-third-party-sources.tar asset."
