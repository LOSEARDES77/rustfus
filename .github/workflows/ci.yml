# Format, lint and test on every push and pull request.
name: CI

# Changes that can't affect the build (docs, license, release workflow) skip CI.
on:
  push:
    branches: [main]
    paths-ignore: &no-ci-paths
      - "**.md"
      - "LICENSE"
      - ".github/workflows/release.yml"
  pull_request:
    paths-ignore: *no-ci-paths

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: x86_64-pc-windows-gnu,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - name: Clippy (Linux, Windows, macOS)
        run: |
          for t in x86_64-unknown-linux-gnu x86_64-pc-windows-gnu aarch64-apple-darwin; do
            cargo clippy --locked --workspace --all-targets --target "$t" -- -D warnings
          done
      # Optional tools some tests use to check the written images.
      - run: sudo apt-get update && sudo apt-get install -y xorriso genisoimage dosfstools e2fsprogs fdisk qemu-utils
      # fido_pwsh_live skips silently without PowerShell.
      - run: command -v pwsh || sudo snap install powershell --classic
      - run: cargo test --workspace --locked

  # Cross clippy only proves the code compiles; this runs the tests on each OS.
  native:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # Windows uses its built-in powershell.exe.
      - if: runner.os == 'Linux'
        run: command -v pwsh || sudo snap install powershell --classic
      - if: runner.os == 'macOS'
        run: command -v pwsh || brew install --cask powershell
      - run: cargo test --workspace --locked

  # rust-version in Cargo.toml must keep building.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --workspace
