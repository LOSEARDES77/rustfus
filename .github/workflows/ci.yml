# Format, lint and test on every push and pull request.
name: CI

# Changes that can't affect the build (docs, license, release workflow) skip CI.
on:
  push:
    branches: [main]
    paths-ignore: &no-ci-paths
      - "**.md"
      - "LICENSE"
      - ".github/workflows/release.yml"
  pull_request:
    paths-ignore: *no-ci-paths

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux GUI build dependencies
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool pkg-config libfontconfig1-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libegl1-mesa-dev
      - run: cargo fmt --all --check
      - name: Clippy (Linux)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # Optional tools some tests use to check the written images.
      - run: sudo apt-get update && sudo apt-get install -y xorriso genisoimage dosfstools e2fsprogs fdisk qemu-utils
      # fido_pwsh_live skips silently without PowerShell.
      - run: command -v pwsh || sudo snap install powershell --classic
      - run: cargo test --workspace --locked

  # GUI backends require their platform SDKs; lint and test them natively.
  native:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool pkg-config libfontconfig1-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libegl1-mesa-dev
      - if: runner.os == 'macOS'
        run: brew install autoconf automake libtool pkg-config
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # Windows uses its built-in powershell.exe.
      - if: runner.os == 'Linux'
        run: command -v pwsh || sudo snap install powershell --classic
      - if: runner.os == 'macOS'
        run: command -v pwsh || brew install --cask powershell
      - run: cargo test --workspace --locked

  # rust-version in Cargo.toml must keep building.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool pkg-config libfontconfig1-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libegl1-mesa-dev
      - run: cargo check --locked --workspace
