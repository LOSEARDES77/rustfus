[package]
name = "rustfus-core"
description = "Rustfus engine: drive listing, image analysis, partitioning, formatting and writing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[dependencies]
bzip2 = "0.6.1"
clap = { workspace = true, optional = true }
crc32fast = "1.5.2"
fatfs = "0.3.6"
flate2 = "1.1.10"
lzma-rust2 = "0.22.0"
md-5 = "0.11.0"
rsa = { version = "0.9.10", default-features = false, features = ["std"] }
ruzstd = "0.9.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11.0"
sha2 = "0.11.1"
zip = { version = "9.0.2", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
