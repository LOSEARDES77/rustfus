[package]
name = "rustfus-gui"
description = "Rustfus' native GPUI Kit interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
gpui-kit = { version = "=0.8.1", default-features = false, features = ["component"] }
rustfus-core.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSImage", "NSMenu", "NSMenuItem"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSAttributedString", "NSData", "NSDictionary", "NSObject", "NSString"] }


