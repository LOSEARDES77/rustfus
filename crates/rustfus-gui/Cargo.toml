[package]
name = "rustfus-gui"
description = "Rustfus' Rufus-style egui interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[dependencies]
eframe = "0.36"
rfd = "0.17"
rustfus-core.workspace = true
functora-egui = { version = "0.2.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSImage"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSAttributedString", "NSData", "NSDictionary", "NSObject", "NSString"] }

[dev-dependencies]
egui_kittest = "0.36.2"
