[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/LOSEARDES77/rustfus"

[workspace.dependencies]
rustfus-core = { path = "crates/rustfus-core" }
rustfus-gui = { path = "crates/rustfus-gui" }
clap = { version = "4.6.7", features = ["derive"] }

[profile.release]
lto = true
strip = true
