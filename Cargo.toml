[package]
name = "rustfus"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Rufus-style bootable USB creator with an egui GUI, for Linux, macOS and Windows."
license = "GPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/LOSEARDES77/rustfus"

[dependencies]
bzip2 = "0.6.1"
crc32fast = "1.5.2"
eframe = "0.36"
fatfs = "0.3.6"
flate2 = "1.1.10"
lzma-rust2 = "0.22.0"
md-5 = "0.11.0"
rfd = "0.17"
rsa = { version = "0.9.10", default-features = false, features = ["std"] }
ruzstd = "0.9.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11.0"
sha2 = "0.11.1"
zip = { version = "9.0.2", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
lto = true
strip = true

[package.metadata.deb]
maintainer = "LOSEARDES77 <victor7galan@gmail.com>"
copyright = "2026 Rustfus contributors; based on Rufus © 2011-2026 Pete Batard"
license-file = ["LICENSE", "0"]
section = "admin"
priority = "optional"
depends = "$auto, libxkbcommon0, libgl1 | libegl1, policykit-1 | pkexec"
recommends = "curl, libvulkan1"
suggests = "ntfs-3g, exfatprogs, udftools"
extended-description = "Rust rewrite of Rufus: write ISO and disk images to USB drives in ISO or DD mode, with Windows, Linux (GRUB/Syslinux, persistence) and FreeDOS boot support."
assets = [
    ["target/release/rustfus", "usr/bin/", "755"],
    ["packaging/rustfus.desktop", "usr/share/applications/", "644"],
    ["packaging/io.github.rustfus.policy", "usr/share/polkit-1/actions/", "644"],
    ["res/rustfus.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["README.md", "usr/share/doc/rustfus/", "644"],
    ["THIRD_PARTY_NOTICES.md", "usr/share/doc/rustfus/", "644"],
]

[package.metadata.generate-rpm]
license = "GPL-3.0-or-later"
summary = "Rufus-style bootable USB creator"
assets = [
    { source = "target/release/rustfus", dest = "/usr/bin/rustfus", mode = "755" },
    { source = "packaging/rustfus.desktop", dest = "/usr/share/applications/rustfus.desktop", mode = "644" },
    { source = "packaging/io.github.rustfus.policy", dest = "/usr/share/polkit-1/actions/io.github.rustfus.policy", mode = "644" },
    { source = "res/rustfus.png", dest = "/usr/share/icons/hicolor/256x256/apps/rustfus.png", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/licenses/rustfus/LICENSE", mode = "644", doc = true },
    { source = "README.md", dest = "/usr/share/doc/rustfus/README.md", mode = "644", doc = true },
    { source = "THIRD_PARTY_NOTICES.md", dest = "/usr/share/doc/rustfus/THIRD_PARTY_NOTICES.md", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
polkit = "*"
"libxkbcommon.so.0()(64bit)" = "*"

[package.metadata.generate-rpm.recommends]
curl = "*"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
